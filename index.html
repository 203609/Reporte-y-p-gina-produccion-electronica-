
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Producción Electrónica</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f3f5f7;
            color: #182536;
        }

        header {
            background-color: #142b45;
            color: white;
            text-align: center;
            padding: 40px 20px;
        }

        h1 {
            margin: 0;
            font-size: clamp(28px, 5vw, 42px);
        }

        main {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
            text-align: center;
        }

        p {
            font-size: 18px;
            line-height: 1.6;
        }

        .integrantes {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px;
            margin-top: 30px;
        }

        .integrante {
            margin: 0;
            width: 280px;
            max-width: 100%;
        }

        .integrante img {
            display: block;
            width: 100%;
            height: 350px;
            object-fit: cover;
            object-position: center;
            border-radius: 12px;
        }

        .integrante figcaption {
            margin-top: 16px;
            font-size: 20px;
            font-weight: bold;
            line-height: 1.5;
        }
    </style>
</head>

<body>
    <header>
        <h1>Producción Electrónica: avances de la materia</h1>
        <p>Aquí vamos a reportar paso a paso lo que es nuestra placa, cómo la creamos y su diseño.</p>
    </header>

    <main>
        <h2>Integrantes del equipo</h2>

        <div class="integrantes">
            <figure class="integrante">
                <img
                    src="jose.jpg.jpeg"
                    alt="José Manuel Góngora Compeán"
                >
                <figcaption>José Manuel Góngora Compeán</figcaption>
            </figure>

            <figure class="integrante">
                <img
                    src="rodrigo.jpg.jpeg"
                    alt="Rodrigo Cermeño"
                >
                <figcaption>Rodrigo Cermeño</figcaption>
            </figure>
        </div>
    </main>
</body>
</html>
